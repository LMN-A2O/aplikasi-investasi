{% extends "base.html" %}
{% block judul %}Saldo - Investasiku{% endblock %}
{% block isi %}
<h1>Saldo</h1>
<div class="kartu">
  <small>SALDO ANDA</small>
  <strong>{{ saldo | rupiah }}</strong>
</div>

<div class="kotak">
  <h2>Setor</h2>
  <form method="post" data-konfirmasi>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="aksi" value="SETOR">
    <label>Nominal (rupiah)
      <input type="number" name="nominal" min="1" step="1" required>
    </label>
    <button type="submit">Setor</button>
  </form>
</div>

<div class="kotak">
  <h2>Tarik</h2>
  <form method="post" data-konfirmasi>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="aksi" value="TARIK">
    <label>Nominal (rupiah)
      <input type="number" name="nominal" min="1" step="1" required>
    </label>
    <button type="submit">Tarik</button>
    {% if saldo > 0 %}
    <button type="button" class="isi-semua" data-nilai="{{ saldo }}">Tarik semua saldo</button>
    {% endif %}
  </form>
</div>
{% endblock %}
